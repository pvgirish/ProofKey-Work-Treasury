[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@gluwa/asc-contracts/=node_modules/@gluwa/asc-contracts/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]
fs_permissions = [{ access = "read", path = "./vendor/safe" }, { access = "read-write", path = "./evidence" }, { access = "read", path = "./schema" }]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 64
fail_on_revert = false
